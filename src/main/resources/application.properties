spring.application.name=api

# --- Variables de entorno locales ---------------------------------------------
# Si existe un archivo .env en el directorio de trabajo se carga como properties.
# Las variables del entorno real (docker run -e, export, etc.) tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# --- Datos de ejemplo locales -------------------------------------------------
# Por defecto usa H2 en memoria para poder levantar la app sin MySQL.
# Para usar MySQL, define estas variables de entorno (o cambia los valores):
#   SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/eventosdami
#   SPRING_DATASOURCE_USERNAME=root
#   SPRING_DATASOURCE_PASSWORD=secret
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:eventosdami;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.resumen.tamano-maximo=10MB

# El S3Client y el S3Template los configura spring-cloud-aws-starter-s3.
app.s3.bucket=${AWS_S3_BUCKET:eventosdami-resumenes}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Credenciales: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y, en el lab,
# AWS_SESSION_TOKEN dentro de .env. Si no están, el SDK usa ~/.aws/credentials
# o el rol IAM de la instancia (recomendado en EC2).

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
